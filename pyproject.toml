[project]
name = "QtStockTicker"
version = "3.0"
description = "Stock Ticker - real-time stock price display using PySide6"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6==6.6.1",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.3",
    "selenium>=4.17.2",
    "arrow>=1.3.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "boto3>=1.26.0",
    "ibapi>=9.81.1.post1",
    "html5lib>=1.1",
]

[project.optional-dependencies]
dev = [
    "py-spy",
    "pyinstaller>=6.4.0",
]

[tool.uv]
# uv project settings
dev-dependencies = [
    "py-spy",
    "pyinstaller>=6.4.0",
]
