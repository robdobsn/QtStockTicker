[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "QtStockTicker"
version = "3.0"
description = "Stock Ticker - real-time stock price display using PySide6"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6==6.6.1",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.3",
    "selenium>=4.17.2",
    "arrow>=1.3.0",
    "python-dateutil>=2.8.2",
    "pytz>=2024.1",
    "boto3>=1.26.0",
    "ibapi>=10.37.1",
    "protobuf>=5.0.0",
    "html5lib>=1.1",
]

[project.scripts]
stockticker = "StockTicker:main"

[tool.uv.sources]
ibapi = { path = "vendor_ibapi" }

[tool.setuptools]
py-modules = [
    "StockTicker",
    "ExchangeRates",
    "ExDivDates",
    "HostedConfigFile",
    "LocalConfig",
    "PickStockDialog",
    "ResourcePath",
    "StockHolding",
    "StockHoldings",
    "StockProviderManager",
    "StockSettingsDialog",
    "StockSymbolList",
    "StockTable",
    "StockValues_Google",
    "StockValues_IB_MarketDataClient",
    "StockValues_IB_MarketDataWrapper",
    "StockValues_IB_PriceGetter",
    "StockValues_InteractiveBrokers",
    "StockValues_Test",
    "StockValues_YahooAPI",
    "YahooCalendarEvents",
]

[tool.setuptools.package-dir]
"" = "src"

[project.optional-dependencies]
dev = [
    "py-spy",
    "pyinstaller>=6.4.0",
]

[dependency-groups]
dev = [
    "py-spy",
    "pyinstaller>=6.4.0",
]
